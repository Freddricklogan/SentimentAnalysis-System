[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentiment-system"
version = "1.0.0"
description = "Sentiment analysis service: a fine-tuned DistilBERT classifier behind a FastAPI/Pydantic v2 API with a batch endpoint, aspect windows, a lexicon baseline, and an evaluation harness that reports F1 on SST-2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
  "transformers>=4.44",
  "torch>=2.4",
  "vaderSentiment>=3.3",
  "typer>=0.12",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
sentiment-system = "sentiment_system.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_system"]

[tool.hatch.build]
include = ["src/sentiment_system/**"]

[tool.uv]
# CPU-only torch keeps the install small; the model is a 268 MB download cached by CI.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/sentiment_system/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*", "vaderSentiment", "vaderSentiment.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sentiment_system"]
omit = ["src/sentiment_system/cli.py"]

[tool.coverage.report]
show_missing = true
